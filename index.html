<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Farmer Profile</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-view="public">
    <main class="page">
      <section class="profile-header public-profile-header">
        <div class="profile-copy">
          <p class="eyebrow">Farmer Profile</p>
          <h1 id="farmerName">Farmer Name</h1>
          <p class="location" id="farmerLocation">Village, Taluka, District</p>
        </div>
        <img class="farmer-photo" id="farmerPhoto" src="" alt="" />
      </section>

      <section class="content-grid">
        <div class="details-panel">
          <h2>Farmer Information</h2>
          <div class="info-grid" id="farmerDetails"></div>
        </div>

      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
