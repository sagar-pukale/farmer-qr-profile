<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Farmer Profile QR</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="profile-header">
        <div>
          <p class="eyebrow">Farmer Profile</p>
          <h1 id="farmerName">Farmer Name</h1>
          <p class="location" id="farmerLocation">Village, Taluka, District</p>
        </div>
        <div class="badge">Verified Farm Details</div>
      </section>

      <section class="content-grid">
        <div class="details-panel">
          <h2>Farmer Information</h2>
          <div class="info-grid" id="farmerDetails"></div>
        </div>

        <aside class="qr-panel">
          <h2>Scan Profile QR</h2>
          <p class="qr-note">This QR code opens the farmer profile page URL.</p>
          <div class="qr-box">
            <div id="qrCode"></div>
          </div>
          <p class="profile-url" id="profileUrl"></p>
          <div class="actions">
            <button type="button" id="downloadQr">Download QR PNG</button>
            <button type="button" class="secondary" id="printProfile">Print Profile</button>
          </div>
        </aside>
      </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
